name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monthly, so stale tables fail even when nothing is pushed.
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in engines; 24 is the active LTS; 26 is current.
        node: ['18', '20', '22', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Shift dates are calendar dates, and a library that only passes on a UTC
  # machine has not been tested. Prove the suite does not quietly depend on
  # the runner's own clock.
  test-non-utc:
    runs-on: ubuntu-latest
    name: node 22 (TZ=Pacific/Auckland)
    env:
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  # AS_OF is the date of the last full review of the tables against their
  # sources. Fail once it is more than six months old (see CONTRIBUTING.md).
  freshness:
    runs-on: ubuntu-latest
    name: tables reviewed in the last six months
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check-freshness
